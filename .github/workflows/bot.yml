name: AI Bot v4

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Số Issue để test (chạy tay)"
        required: true
      test_comment:
        description: "Nội dung comment giả lập"
        required: true
        default: "bot làm được gì"

# Quyền tối thiểu cần thiết
# - contents: write  → bot commit file
# - issues:   write  → bot post comment, tạo issue
# - models:   read   → gọi GitHub Models (AI)
permissions:
  contents: write
  issues: write
  models: read

# Đảm bảo các comment trong CÙNG một issue chạy tuần tự
# tránh 2 lần commit cùng lúc ghi đè lên nhau
concurrency:
  group: bot-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  bot:
    # Bỏ qua: comment trong PR, comment của bot, comment của bot khác
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
       github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run bot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          COMMENT_BODY: ${{ github.event.comment.body || inputs.test_comment }}
          COMMENT_USER: ${{ github.event.comment.user.login || github.actor }}
          AUTHORIZED_USERS: ${{ vars.AUTHORIZED_USERS }}
        run: |
          set -o pipefail
          python bot.py 2>&1 | tee bot-run.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_id }}
          path: bot-run.log
          retention-days: 7
          if-no-files-found: ignore
